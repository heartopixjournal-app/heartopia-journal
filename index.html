<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#8FA58E">

    <title>Heartopia Journal</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <!-- Estilos de Heartopia Journal -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="welcome screen active" id="welcomeScreen">

        <div class="welcome-decoration">
            🌿
        </div>

        <div class="welcome-content">

            <p class="eyebrow">TU DIARIO DE AVENTURAS</p>

            <h1>
                Heartopia
                <span>Journal</span>
            </h1>

            <p class="tagline">
                Explora · Registra · Colecciona
            </p>

            <div class="illustration">
    <img
        src="heartopia-cover.jpg"
        alt="Ilustración de Heartopia Journal"
        class="cover-image"
    >
</div>

            <p class="description">
                Guarda tus pequeños descubrimientos
                y completa tu colección a tu ritmo.
            </p>

            <button class="primary-button" id="startButton">
    Comenzar
</button>

            <button class="secondary-button">
                ♡ &nbsp; Mi progreso
            </button>

        </div>

        <p class="footer-message">
            Pequeños descubrimientos, grandes historias.
        </p>

    </main>

</body>

</html>
